name: contract
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: contract (bottom lines)
        run: bash tests/contract.test.sh
      - name: smoke (syntax + sandbox install)
        run: bash tests/smoke.sh
